name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup target add ${{ matrix.target }}
      - run: cargo test --locked
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          bin=git-numeria
          [ "${{ runner.os }}" = "Windows" ] && bin=git-numeria.exe
          name=git-numeria-${GITHUB_REF_NAME}-${{ matrix.target }}
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/$bin" README.md LICENSE doc/git-numeria.1 "$name"/
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$name.zip" "$name"
          else
            tar czf "$name.tar.gz" "$name"
          fi
      - uses: softprops/action-gh-release@v3
        with:
          name: Numeria ${{ github.ref_name }}
          body_path: .github/release-notes.md
          files: |
            git-numeria-*.tar.gz
            git-numeria-*.zip
