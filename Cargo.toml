[package]
name = "numeria"
version = "0.0.1"
edition = "2024"
description = "Numeria: dimension-aware git diff statistics — code / tests / non-code / files, each with added·deleted·modified counts (Go & Python aware)"
license = "MIT"
repository = "https://github.com/omeyang/Numeria"
keywords = ["git", "diff", "statistics", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "git-numeria"
path = "src/main.rs"

[dependencies]

[profile.release]
strip = true
lto = true
